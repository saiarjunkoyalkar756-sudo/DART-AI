version: '3.8'

services:
  app_staging:
    build: .
    container_name: dart_ai_staging
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://dart_staging_user:dart_staging_pass@postgres_staging:5432/dart_staging_db
      - REDIS_URL=redis://redis_staging:6379/0
      - ENVIRONMENT=staging
    depends_on:
      - postgres_staging
      - redis_staging
    restart: always

  postgres_staging:
    image: postgres:16-alpine
    container_name: dart_ai_postgres_staging
    environment:
      POSTGRES_USER: dart_staging_user
      POSTGRES_PASSWORD: dart_staging_pass
      POSTGRES_DB: dart_staging_db
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always

  redis_staging:
    image: redis:7-alpine
    container_name: dart_ai_redis_staging
    ports:
      - "6380:6379"
    restart: always

volumes:
  postgres_staging_data:
