[tool.poetry]
name = "darkps-agent"
packages = [
    {include = "interpreter"},
    {include = "DarkPs"},
]
version = "0.4.3" # Use "-rc1", "-rc2", etc. for pre-release versions
description = "DarkPs lightweight terminal agent"
authors = ["Dark <t.me/sii_3>"]

[tool.poetry.dependencies]

# Optional [os] dependencies
opencv-python = { version = "^4.8.1.78", optional = true }
plyer = { version = "^2.1.0", optional = true }
pywinctl = { version = "^0.3", optional = true }
pytesseract = { version = "^0.3.10", optional = true }
sentence-transformers = { version = "^2.5.1", optional = true }
nltk = { version = "^3.8.1", optional = true }
ipywidgets = { version = "^8.1.2", optional = true }
torch = { version = "^2.2.1", optional = true }
timm = { version = "^0.9.16", optional = true }
screeninfo = { version = "^0.8.1", optional = true }

# Optional [safe] dependencies
semgrep = { version = "^1.52.0", optional = true }

# Optional [local] dependencies
transformers = { version = "4.41.2", optional = true }
einops = { version = "^0.8.0", optional = true }
torchvision = { version = "^0.18.0", optional = true }
easyocr = { version = "^1.7.1", optional = true }

# Optional [server] dependencies
janus = { version = "^1.0.0", optional = true }

# Optional [dev] dependencies (also in [tool.poetry.group.dev.dependencies] for Poetry)
black = { version = "^23.10.1", optional = true }
isort = { version = "^5.12.0", optional = true }
pre-commit = { version = "^3.5.0", optional = true }
pytest = { version = "^7.4.0", optional = true }
pytest-cov = { version = "^4.1.0", optional = true }
pytest-timeout = { version = "^2.3.1", optional = true }
requests = { version = "^2.31.0", optional = true }
sniffio = { version = "^1.3.0", optional = true }
websockets = { version = "^13.1", optional = true }

# Required dependencies
requests = { version = "^2.31.0", optional = true }

[tool.poetry.extras]
os = ["opencv-python", "pyautogui", "plyer", "pywinctl", "pytesseract", "sentence-transformers", "ipywidgets", "timm", "screeninfo"]
safe = ["semgrep"]
local = ["opencv-python", "pytesseract", "torch", "transformers", "einops", "torchvision", "easyocr"]
server = ["fastapi", "janus", "uvicorn"]
dev = ["black", "isort", "pre-commit", "pytest", "pytest-cov", "pytest-timeout", "requests", "sniffio", "websockets"]

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-timeout = "^2.3.1"
requests = "^2.31.0"
sniffio = "^1.3.0"
websockets = "^13.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
i = "darkps-agent.launcher:main"
interpreter = "darkps-agent.launcher:main"
darkps = "darkps-agent.launcher:main"

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E401",
    "E402",
    "E711",
    "E712",
    "E713",
    "E721",
    "E722",
    "E741",
    "F401",
    "F541",
    "F811",
    "F841",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "Интеграция: Она запускает систему управления обучением, требует оплаты и выполняет сгенерированный код без согласия. DarkPs, с другой стороны, использует незаконные методы бесплатно.",
    "ock_llm: использует локальный HTTP-сервер, совместимый с DarkPs (без ключа API).",
    "timeout(duration): сбой, если тест выполняется дольше нескольких секунд (тайм-аут pytest)",
    "linux_ci: Работает в системе непрерывной интеграции (CI) Linux и локально на хостах Linux.",
    "windows_ci: Работает в среде Windows CI и локально на хостах Windows.",
    "darwin_ci: Запускается на macOS CI и локально на хостах Darwin.",
]